plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.oconnor'
version = '0.0.1-SNAPSHOT'
description = 'authentication-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    def feedUrl = System.env.AZURE_ARTIFACTS_FEED_URL ?: project.findProperty('AZURE_ARTIFACTS_FEED_URL')
    if (feedUrl) {
        maven {
            name = 'AzureArtifacts'
            url = feedUrl
            credentials {
                username = 'AzureArtifacts'
                password = System.env.AZURE_ARTIFACTS_PAT
                        ?: project.findProperty('AZURE_ARTIFACTS_PAT')
            }
        }
    }
}

dependencies {
    // Shared security library (SecurityConfig, WebSocket security, logging filter, etc.)
    implementation 'edu.oconnor:shared-security:1.0.7'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}
