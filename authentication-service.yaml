location: australiaeast
resourceGroup: ai-platform
type: Microsoft.App/containerApps
name: authentication-service
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/53f34d3b-bdc7-4e68-89c4-0e4f1947eb31/resourceGroups/ai-platform/providers/Microsoft.App/managedEnvironments/managedEnvironment-aiplatform-8573
  configuration:
    registries:
      - server: oconnoraiplatform.azurecr.io
        username: oconnoraiplatform
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: 
      - name: jwt-secret
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/jwt-secret
        identity: System
      - name: db-password
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/db-password
        identity: System
      - name: db-url
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/db-url
        identity: System
      - name: db-username
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/db-username
        identity: System
      - name: jwt-issuer-uri
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/jwt-issuer-uri
        identity: System
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
  template:
    containers:
      - name: authentication-service
        image: oconnoraiplatform.azurecr.io/authentication-service:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: "prod"
          - name: DB_URL
            secretRef: db-url
          - name: DB_USERNAME
            secretRef: db-username
          - name: DB_PASSWORD
            secretRef: db-password
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: JWT_ISSUER_URI
            secretRef: jwt-issuer-uri
          - name: JWT_ACCESS_TOKEN_EXPIRY
            value: "900"
          - name: JWT_REFRESH_TOKEN_EXPIRY
            value: "604800"
          # Directs Spring Boot's rolling file appender to the shared log volume
          - name: LOGGING_FILE_NAME
            value: "/var/log/app/authentication-service.log"
        volumeMounts:
          - volumeName: app-logs
            mountPath: /var/log/app

      # Filebeat sidecar — reads log files and ships them to Elasticsearch.
      # Build and push the image before deploying:
      #   docker build -t oconnoraiplatform.azurecr.io/filebeat:latest kibana/filebeat/
      #   docker push oconnoraiplatform.azurecr.io/filebeat:latest
      - name: filebeat
        image: oconnoraiplatform.azurecr.io/filebeat:v5
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ELASTICSEARCH_HOST
            value: "http://elasticsearch.internal.proudground-90080d26.australiaeast.azurecontainerapps.io:80"
          - name: ELASTICSEARCH_USERNAME
            value: "elastic"
          - name: ELASTICSEARCH_PASSWORD
            value: "KZjpxzuWoYx41YLhggNx"
          - name: APP_SERVICE
            value: "authentication-service"
          - name: INDEX_NAME
            value: "auth-service"
        volumeMounts:
          - volumeName: app-logs
            mountPath: /var/log/app

    volumes:
      # Shared ephemeral volume — both containers in the same replica see the same files
      - name: app-logs
        storageType: EmptyDir

    scale:
      minReplicas: 1
      maxReplicas: 3
