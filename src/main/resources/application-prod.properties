spring.application.name=authentication-service
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.show-details=always

server.port=8080
# Azure AD JWT issuer (set via environment variable from Key Vault)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# PostgreSQL datasource (set via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Platform JWT signing (set via environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:900}
app.jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800}

spring.docker.compose.enabled=false

# Azure AD app credentials for Graph API role lookup
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID}
azure.client-secret=${AZURE_CLIENT_SECRET}
