spring.application.name=authentication-service
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
server.port=8081
# Azure AD JWT issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/dcd857fa-da1c-42e4-801b-702d52e946b1/v2.0

# PostgreSQL datasource (set via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Platform JWT signing (set via environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:900}
app.jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800}

spring.docker.compose.enabled=false
